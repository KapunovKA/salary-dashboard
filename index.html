<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="referrer" content="no-referrer">
    <title>Дашборд зарплаты</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>
    <style>
        /* ===== CSS переменные для тем ===== */
        :root {
            --bg-body: #f0f4fd;
            --bg-dashboard: #ffffff;
            --bg-widget: #f0f4fe;
            --bg-widget-hover: #e6edfc;
            --border-widget: rgba(255,255,255,0.5);
            --text-primary: #0b1a33;
            --text-secondary: #3c4b64;
            --text-muted: #5a6f8c;
            --text-light: #8696b2;
            --shadow: 0 20px 48px rgba(0, 8, 28, 0.08);
            --shadow-hover: 0 8px 20px rgba(30, 60, 130, 0.08);
            --clock-bg: #1f2a44;
            --clock-text: #f0f4ff;
            --clock-border: #3b4a6b;
            --clock-hover: #263459;
            --modal-bg: #ffffff;
            --modal-shadow: 0 30px 60px rgba(0, 8, 28, 0.3);
            --chart-bg: #fafcff;
            --tooltip-bg: rgba(255, 255, 255, 0.97);
            --tooltip-border: rgba(200, 212, 235, 0.5);
            --border-color: #eef3fb;
            --period-btn-bg: #f0f4fe;
            --period-btn-hover: #e0e8f6;
            --period-btn-active: #1f2a44;
            --period-btn-text: #3c4b64;
            --period-btn-active-text: #ffffff;
            --badge-bg: #dce5f5;
            --badge-text: #1d3457;
            --change-positive: #1a7d4a;
            --change-negative: #b13a4b;
            --status-color: #4a7bc4;
            --table-header-bg: #e8edf8;
            --table-row-hover: #f5f8ff;
            --table-border: #dce3ef;
            --input-bg: #ffffff;
            --input-border: #c8d4e8;
            --btn-primary: #4a7bc4;
            --btn-primary-hover: #3a6ab0;
            --btn-danger: #c45a6b;
            --btn-danger-hover: #b14a5a;
            --btn-success: #2e7d5e;
            --btn-success-hover: #1e6d4e;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --dashboard-shadow: 0 20px 48px rgba(0, 8, 28, 0.08);
            --chart-text-color: #0b1a33;
            --chart-grid-color: #dce3ef;
            --chart-legend-color: #3c4b64;
            --highlight-bg: rgba(74, 123, 196, 0.15);
            --login-gradient: linear-gradient(135deg, #4a7bc4 0%, #6b96d9 100%);
            --login-gradient-hover: linear-gradient(135deg, #3a6ab0 0%, #5a86c9 100%);
            --login-gradient-logout: linear-gradient(135deg, #c45a6b 0%, #d97a8a 100%);
            --login-gradient-logout-hover: linear-gradient(135deg, #b14a5a 0%, #c96a7a 100%);
            --login-shadow: 0 4px 15px rgba(74, 123, 196, 0.35);
            --login-shadow-hover: 0 6px 25px rgba(74, 123, 196, 0.5);
            --login-shadow-logout: 0 4px 15px rgba(196, 90, 107, 0.35);
            --login-shadow-logout-hover: 0 6px 25px rgba(196, 90, 107, 0.5);
            --weather-bg: rgba(255,255,255,0.08);
            --chart-text-color-light: #0b1a33;
            --chart-text-color-dark: #e6edf3;
            --quarter-bg: #dce5f5;
            --quarter-border: #b8cbe0;
        }

        [data-theme="dark"] {
            --bg-body: #0d1117;
            --bg-dashboard: #161b22;
            --bg-widget: #21262d;
            --bg-widget-hover: #2d333b;
            --border-widget: rgba(255,255,255,0.08);
            --text-primary: #e6edf3;
            --text-secondary: #b0c4d9;
            --text-muted: #8b9eb5;
            --text-light: #6a7e9e;
            --shadow: 0 20px 48px rgba(0, 0, 0, 0.4);
            --shadow-hover: 0 8px 20px rgba(0, 0, 0, 0.3);
            --clock-bg: #0d1117;
            --clock-text: #e6edf3;
            --clock-border: #30363d;
            --clock-hover: #161b22;
            --modal-bg: #161b22;
            --modal-shadow: 0 30px 60px rgba(0, 0, 0, 0.6);
            --chart-bg: #0d1117;
            --tooltip-bg: rgba(22, 27, 34, 0.97);
            --tooltip-border: rgba(48, 54, 61, 0.8);
            --border-color: #30363d;
            --period-btn-bg: #21262d;
            --period-btn-hover: #2d333b;
            --period-btn-active: #58a6ff;
            --period-btn-text: #b0c4d9;
            --period-btn-active-text: #0d1117;
            --badge-bg: #21262d;
            --badge-text: #b0c4d9;
            --change-positive: #3fb950;
            --change-negative: #f85149;
            --status-color: #58a6ff;
            --table-header-bg: #21262d;
            --table-row-hover: #1c2128;
            --table-border: #30363d;
            --input-bg: #0d1117;
            --input-border: #30363d;
            --btn-primary: #58a6ff;
            --btn-primary-hover: #4796f0;
            --btn-danger: #f85149;
            --btn-danger-hover: #e03a32;
            --btn-success: #3fb950;
            --btn-success-hover: #2ea043;
            --dashboard-shadow: 0 20px 48px rgba(0, 0, 0, 0.4);
            --chart-text-color: #e6edf3;
            --chart-grid-color: #30363d;
            --chart-legend-color: #b0c4d9;
            --highlight-bg: rgba(88, 166, 255, 0.15);
            --login-gradient: linear-gradient(135deg, #58a6ff 0%, #79b8ff 100%);
            --login-gradient-hover: linear-gradient(135deg, #4796f0 0%, #68a8f0 100%);
            --login-gradient-logout: linear-gradient(135deg, #f85149 0%, #f4706a 100%);
            --login-gradient-logout-hover: linear-gradient(135deg, #e03a32 0%, #e8605a 100%);
            --login-shadow: 0 4px 15px rgba(88, 166, 255, 0.35);
            --login-shadow-hover: 0 6px 25px rgba(88, 166, 255, 0.5);
            --login-shadow-logout: 0 4px 15px rgba(248, 81, 73, 0.35);
            --login-shadow-logout-hover: 0 6px 25px rgba(248, 81, 73, 0.5);
            --weather-bg: rgba(255,255,255,0.05);
            --chart-text-color-light: #0b1a33;
            --chart-text-color-dark: #e6edf3;
            --quarter-bg: #1c2333;
            --quarter-border: #3b4a6b;
        }

        /* ===== Общие стили ===== */
        * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif; }
        body { background:var(--bg-body); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:20px 24px; margin:0; transition:background var(--transition), color var(--transition); }
        .dashboard { width:100%; max-width:100%; background:var(--bg-dashboard); border-radius:44px; box-shadow:var(--shadow); padding:28px 36px 32px; transition:all var(--transition); box-sizing:border-box; }

        /* ===== Анимации ===== */
        @keyframes fadeInUp {
            from { opacity:0; transform:translateY(12px); }
            to { opacity:1; transform:translateY(0); }
        }
        @keyframes pulseGlow {
            0% { box-shadow:0 0 0 0 rgba(74,123,196,0.3); }
            50% { box-shadow:0 0 0 8px rgba(74,123,196,0); }
            100% { box-shadow:0 0 0 0 rgba(74,123,196,0); }
        }
        @keyframes highlightRow {
            0% { background:var(--highlight-bg); }
            100% { background:transparent; }
        }
        @keyframes loginPulse {
            0% { box-shadow:0 0 0 0 rgba(74,123,196,0.4); }
            70% { box-shadow:0 0 0 10px rgba(74,123,196,0); }
            100% { box-shadow:0 0 0 0 rgba(74,123,196,0); }
        }
        .fade-in { animation:fadeInUp 0.5s ease forwards; }
        .pulse { animation:pulseGlow 1s ease 1; }

        /* ===== Верхняя панель ===== */
        .top-bar { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px 20px; margin-bottom:20px; }
        .top-bar-left { display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
        .top-bar-left .action-btn, .top-bar-left .settings-btn { background:var(--bg-widget); border:1px solid var(--border-widget); border-radius:40px; padding:8px 16px; cursor:pointer; font-size:0.85rem; color:var(--text-secondary); transition:all var(--transition); display:flex; align-items:center; gap:6px; }
        .top-bar-left .action-btn:hover, .top-bar-left .settings-btn:hover { background:var(--bg-widget-hover); transform:translateY(-1px); }
        .top-bar-left .action-btn:active, .top-bar-left .settings-btn:active { transform:scale(0.95); }
        .file-input-hidden { display:none; }

        /* ===== Кнопка входа/выхода ===== */
        .login-btn {
            border: none;
            border-radius: 40px;
            padding: 10px 24px;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            color: #fff;
            letter-spacing: 0.3px;
            position: relative;
            overflow: hidden;
            background: var(--login-gradient);
            box-shadow: var(--login-shadow);
        }
        .login-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transition: left 0.6s ease;
        }
        .login-btn:hover::before { left: 100%; }
        .login-btn:hover { transform:translateY(-2px) scale(1.02); box-shadow:var(--login-shadow-hover); }
